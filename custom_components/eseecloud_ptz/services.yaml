move:
  name: Move camera
  description: Move a configured camera for a bounded duration, then send Stop.
  fields:
    config_entry_id:
      name: Configuration entry ID
      description: Home Assistant configuration entry ID for the camera.
      required: true
      selector:
        config_entry:
          integration: eseecloud_ptz
    direction:
      name: Direction
      required: true
      selector:
        select:
          options:
            - up
            - down
            - left
            - right
    duration:
      name: Duration
      description: Movement time in seconds.
      default: 0.5
      selector:
        number:
          min: 0.1
          max: 3.0
          step: 0.1
          unit_of_measurement: s
          mode: box
